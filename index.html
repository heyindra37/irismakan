<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Rak Buku Cerita Iris</title>
  <meta name="theme-color" content="#f9a8d4">
  <link rel="icon" type="image/png" href="books/istana-mulut/assets/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Fredoka', ui-rounded, system-ui, sans-serif; color: #3b1d3a; -webkit-user-select: none; user-select: none;
      background: linear-gradient(135deg, #fff0f6 0%, #f3e8ff 55%, #fef9c3 100%); min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }
    h1 { margin: 0 0 clamp(8px, 2vh, 18px); font-size: clamp(22px, 6vh, 44px); background: linear-gradient(90deg, #be185d, #7c3aed); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 small { font-size: .5em; color: #6b4a69; -webkit-text-fill-color: #6b4a69; font-weight: 500; margin-left: .6em; }
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(46vw, 300px), 1fr)); gap: clamp(10px, 2vw, 22px); }
    .book { display: block; text-decoration: none; color: inherit; background: #fff; border: 3px solid #f9a8d4; border-radius: 22px; overflow: hidden; box-shadow: 0 6px 0 #f9a8d4, 0 14px 24px -10px rgba(190,24,93,.35); transition: transform .12s, box-shadow .12s; }
    .book:active { transform: translateY(5px); box-shadow: 0 1px 0 #f9a8d4; }
    .book img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #fbcfe8; }
    .book div { padding: .5em .9em .7em; }
    .book b { display: block; font-size: clamp(16px, 3.2vh, 22px); color: #be185d; line-height: 1.15; }
    .book span { font-size: clamp(12px, 2.4vh, 15px); color: #6b4a69; font-weight: 500; }
    @media (orientation: portrait) { body::before { content: '🔄 Putar layar ke landscape ya!'; display: block; text-align: center; font-weight: 700; color: #be185d; margin-bottom: 10px; } }
  </style>
</head>
<body>
  <h1>📚 Rak Buku Cerita <small>untuk Putri Iris</small></h1>
  <main class="shelf" id="shelf"></main>
  <script>
    /* Tambah buku baru: salin satu objek di bawah, lalu sesuaikan. */
    const BOOKS = [
      {
        folder: 'istana-mulut-level-1',
        title: 'Istana Mulut Putri Iris · Level 1',
        desc: 'Dasar: suap sendiri, kunyah di geraham, telan bersama Cinderella.',
        cover: 'assets/hero.webp'
      },
      {
        folder: 'istana-mulut',
        title: 'Istana Mulut Putri Iris · Level 2',
        desc: 'Estafet Lidah Cinderella, ketukan kunyah cepat & Sensor Bubur Bintang.',
        cover: 'assets/palace.webp'
      }
    ];
    const shelf = document.getElementById('shelf');
    BOOKS.forEach(b => {
      const a = document.createElement('a');
      a.className = 'book'; a.href = `books/${b.folder}/`;
      a.innerHTML = `<img src="books/${b.folder}/${b.cover}" alt="" loading="lazy"><div><b></b><span></span></div>`;
      a.querySelector('b').textContent = b.title; a.querySelector('span').textContent = b.desc;
      shelf.append(a);
    });
  </script>
</body>
</html>
